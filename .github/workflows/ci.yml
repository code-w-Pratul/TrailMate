name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A new push to the same branch cancels the previous run: no point paying for
# CI on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests never reach a third-party API (nock blocks the network), so no API
  # keys are needed here — which is exactly why the suite is deterministic.
  NODE_ENV: test

jobs:
  # ---------------------------------------------------------------------------
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the API
        run: npm run lint --workspace trailmate-server

      - name: Lint the client
        run: npm run lint --workspace trailmate-client

      - name: Check formatting
        run: npm run format:check

  # ---------------------------------------------------------------------------
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the version declared in `engines`; the upper bound
        # is what production runs.
        node: [20, 22]

    services:
      # Supplying Mongo as a service container lets the suite skip
      # mongodb-memory-server's binary download — faster, and it cannot fail
      # because of a transient CDN problem.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the API test suite
        run: npm run test --workspace trailmate-server
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/trailmate_ci

      - name: Build the client
        run: npm run build --workspace trailmate-client

      - name: Upload the client bundle
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect coverage
        run: npm run test:coverage --workspace trailmate-server
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/trailmate_ci

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: server/coverage/lcov.info
          retention-days: 7

  # ---------------------------------------------------------------------------
  smoke:
    name: Boot smoke test
    runs-on: ubuntu-latest
    needs: test

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the client
        run: npm run build --workspace trailmate-client

      # Proves the thing actually starts in production mode, serves the built
      # SPA, and answers its own health check — the failure mode unit tests
      # cannot catch.
      - name: Start the API in production mode
        run: |
          node server/src/server.js &
          echo "PID=$!" >> "$GITHUB_ENV"
        env:
          NODE_ENV: production
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/trailmate_smoke
          JWT_SECRET: ci-only-secret-that-is-comfortably-long-enough-32
          CORS_ORIGIN: http://localhost:5173

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health/live > /dev/null; then
              echo "API is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready in 30s" >&2
          exit 1

      - name: Assert health, config and the SPA shell
        run: |
          set -euo pipefail

          echo "--- /api/health ---"
          curl -fsS http://127.0.0.1:5000/api/health | tee /tmp/health.json
          grep -q '"success":true' /tmp/health.json

          echo "--- /api/meta/config ---"
          curl -fsS http://127.0.0.1:5000/api/meta/config | tee /tmp/config.json
          grep -q '"providers"' /tmp/config.json

          echo "--- SPA shell at / ---"
          curl -fsS http://127.0.0.1:5000/ | grep -q '<div id="root"'

          echo "--- SPA history fallback at /trips ---"
          curl -fsS http://127.0.0.1:5000/trips | grep -q '<div id="root"'

          echo "--- unknown API route is a clean 404 ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/nope)" = "404"

          echo "--- validation rejects bad input without calling upstream ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:5000/api/currency?from=US&to=INR')" = "400"

      - name: Stop the API
        if: always()
        run: kill "${PID}" || true

  # ---------------------------------------------------------------------------
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: trailmate-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: false
          load: true
          tags: trailmate-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # An image that builds but will not boot is worthless, so start both and
      # check their health endpoints.
      - name: Verify the API image boots
        run: |
          set -euo pipefail
          docker network create trailmate-ci
          docker run -d --name mongo --network trailmate-ci mongo:7
          docker run -d --name api --network trailmate-ci -p 5000:5000 \
            -e NODE_ENV=production \
            -e MONGODB_URI=mongodb://mongo:27017/trailmate \
            -e JWT_SECRET=ci-only-secret-that-is-comfortably-long-enough-32 \
            trailmate-api:ci

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5000/api/health > /dev/null; then
              echo "API image healthy after ${i}s"
              curl -fsS http://127.0.0.1:5000/api/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::API image failed to become healthy"
          docker logs api
          exit 1

      - name: Verify the web image serves the SPA
        run: |
          set -euo pipefail
          docker run -d --name web --network trailmate-ci -p 8080:80 \
            -e API_UPSTREAM=http://api:5000 trailmate-web:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root"'
          echo "SPA served"

          # The nginx reverse proxy must reach the API container.
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"success":true'
          echo "Reverse proxy to /api works"

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs api  || true
          docker logs web  || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f api web mongo || true
          docker network rm trailmate-ci || true
