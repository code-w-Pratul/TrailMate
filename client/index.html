<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>TrailMate — plan a trip in one view</title>
    <meta
      name="description"
      content="TrailMate pulls weather, attractions, currency rates, country facts and an AI briefing for any destination into a single trip dashboard."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />

    <!--
      Applied before first paint so a dark-mode user never sees a white flash.
      Reads the same key the PreferencesProvider owns, and falls back to the OS
      setting when the user has not chosen explicitly.
    -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('trailmate.preferences') || '{}');
          var theme = stored.theme || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage unavailable (private mode): fall back to light. */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <noscript>TrailMate needs JavaScript enabled to plan trips.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
