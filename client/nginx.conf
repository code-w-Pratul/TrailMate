# =============================================================================
# nginx config for the TrailMate SPA.
#
# Rendered by the stock nginx entrypoint (envsubst) at container start, so
# ${API_UPSTREAM} is substituted from the environment. Two jobs:
#   1. serve the built SPA with correct caching and a history fallback
#   2. reverse-proxy /api to the API container, keeping everything same-origin
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Security headers. The CSP allows the third-party *images* TrailMate needs
    # (map tiles, Wikipedia thumbnails, flags, cover photos) but no third-party
    # scripts — the client has no external JS at all.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container health probe — deliberately cheap and dependency-free.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API trusts one proxy hop for rate limiting; without these headers
        # every client would look like it shared the nginx container's IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # A cold /api/plan fans out to several providers; allow for that.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering off so the client sees the response as soon as it is ready.
        proxy_buffering off;
    }

    # ---- Static assets ------------------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA history fallback ----------------------------------------------
    # index.html must never be cached, or users get a stale shell pointing at
    # asset filenames that no longer exist after a deploy.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
